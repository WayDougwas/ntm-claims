name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Issues in Portuguese are fine too.

  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Screenshots, examples, or other mods that already do something similar.
