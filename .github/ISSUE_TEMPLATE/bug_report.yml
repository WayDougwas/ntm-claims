name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill in what you can. Issues in Portuguese are welcome too.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Steps to reproduce help a lot.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NTM Claims version
      placeholder: "1.0.3"
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer (dedicated server)
        - Multiplayer (LAN / open to LAN)
    validations:
      required: true

  - type: input
    id: neoforge
    attributes:
      label: NeoForge version
      placeholder: "21.1.265"

  - type: textarea
    id: mods
    attributes:
      label: Related mods and versions
      description: Versions of the mods this add-on works with, or a link to the modpack.

  - type: textarea
    id: log
    attributes:
      label: Log / crash report
      description: Upload `logs/latest.log` or the crash report (drag the file here), or paste the relevant part.
      render: text
